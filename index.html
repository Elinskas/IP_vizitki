<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор визиток</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-3">Калькулятор визиток</h1>
        </header>

        <section class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <form id="order" class="shadow-lg p-4 rounded bg-white" onsubmit="return false">
                    <div class="mb-4">
                        <label for="card-quantity" class="form-label fw-semibold">Количество визиток</label>
                        <input type="number" id="card-quantity" class="form-control form-control-lg"
                               value="90" min="30" step="30">
                    </div>

                    <div class="mb-4">
                        <label for="card-paper" class="form-label fw-semibold">Бумага</label>
                        <select id="card-paper" class="form-select form-select-lg"></select>
                    </div>

                    <div class="mb-4">
                        <label for="card-color" class="form-label fw-semibold">Цветность</label>
                        <select id="card-color" class="form-select form-select-lg"></select>
                    </div>

                    <div class="border-top pt-3 d-flex justify-content-between align-items-end">
                        <span class="text-secondary">К оплате:</span>
                        <span class="display-6 fw-bold text-success">
                            <span id="final-price">0</span>&nbsp;₽
                        </span>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="my.js"></script>
</body>
</html>
